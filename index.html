<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard BI - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2e5a44 0%, #52b788 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #1a2e26;
        }

        .login-container {
            background: white;
            border-radius: 12px;
            padding: 48px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            background-color: #d4a373;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #2e5a44;
            font-size: 24px;
        }

        .brand-name {
            font-size: 24px;
            font-weight: 700;
            color: #2e5a44;
        }

        h1 {
            font-size: 20px;
            color: #1a2e26;
            margin-bottom: 8px;
        }

        p {
            color: #62726b;
            font-size: 14px;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            color: #2e5a44;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #eef2f0;
            border-radius: 8px;
            font-size: 14px;
            transition: border 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #52b788;
            box-shadow: 0 0 0 3px rgba(82, 183, 136, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #2e5a44 0%, #52b788 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 16px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(46, 90, 68, 0.3);
        }

        .credentials {
            background-color: #f0f8f4;
            border: 1px solid #d1f2d9;
            border-radius: 8px;
            padding: 16px;
            margin-top: 24px;
            font-size: 12px;
            color: #2e5a44;
        }

        .credentials strong {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .credentials code {
            background-color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
        }

        .error {
            color: #dc2626;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="brand">
            <div class="brand-icon">🌱</div>
            <div class="brand-name">EcoSemente</div>
        </div>
        <h1>Dashboard BI</h1>
        <p>Gestão de Estoque - Agricultura Familiar</p>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="error" id="errorMessage"></div>
            <button type="submit">Entrar</button>
        </form>

        <div class="credentials">
            <strong>Credenciais de Teste:</strong>
            Usuário: <code>admin</code><br>
            Senha: <code>123456</code>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');

            if (username === 'admin' && password === '123456') {
                sessionStorage.setItem('isAuthenticated', 'true');
                sessionStorage.setItem('userName', username);
                window.location.href = 'dashboard.html';
            } else {
                errorMessage.textContent = 'Usuário ou senha inválidos!';
                errorMessage.style.display = 'block';
                document.getElementById('password').value = '';
            }
        }
    </script>
</body>
</html>
